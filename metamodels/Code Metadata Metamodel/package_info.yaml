collector_type: code_metadata
config_schema:
- description: 源代码项目或目录的路径
  label: 源代码路径
  name: source_path
  placeholder: /path/to/project
  required: true
  type: string
- default:
  - python
  description: 要采集的编程语言列表，如 ["python", "javascript", "java"]
  label: 支持的语言
  name: languages
  options:
  - python
  - javascript
  - typescript
  - java
  placeholder: '["python", "javascript", "java"]'
  required: false
  type: json
- default: []
  description: 要排除的文件路径模式列表
  label: 排除模式
  name: exclude_patterns
  options:
  - __pycache__
  - node_modules
  placeholder: '["__pycache__", "node_modules"]'
  required: false
  type: json
- default: code
  description: 可选，用于标识数据源
  label: 数据源标识
  name: source
  placeholder: code
  required: false
  type: string
